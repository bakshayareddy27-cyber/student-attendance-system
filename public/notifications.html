<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parent alerts | Rollcall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%2310231f'/%3E%3Cpath d='M8 7v20M14 7v20M20 7v20M26 7v20' stroke='%23f2c230' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/vendor/fonts/bricolage/index.css">
  <link rel="stylesheet" href="/vendor/fonts/figtree/index.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="notifications" data-roles="admin">
<div id="shell"></div>
<main id="page" class="page" hidden>
  <div class="page-head">
    <div><h1 class="page-title">Parent alerts</h1><p class="page-sub">Every absence email, with delivery status. Failed alerts retry automatically with a growing delay.</p></div>
    <select class="form-select w-auto" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="SENT">Sent</option><option value="PENDING">Sending</option><option value="FAILED">Failed</option><option value="CANCELLED">Cancelled</option></select>
  </div>
  <div class="row g-3 mb-3" id="stats"></div>
  <div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Sent to</th><th>Status</th><th class="text-end">Tries</th><th>When</th><th class="text-end">Actions</th></tr></thead><tbody id="body"></tbody></table></div>
    <div class="d-flex justify-content-between align-items-center p-3 border-top" id="pager"></div></div>
</main>
<div class="modal fade" id="mailModal" tabindex="-1" aria-labelledby="mailTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content">
  <div class="modal-header"><h2 class="modal-title h5" id="mailTitle">Email sent to the parent</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body p-0"><iframe id="mailFrame" title="Email preview" style="width:100%;height:440px;border:0;border-radius:0 0 16px 16px" sandbox></iframe></div></div></div></div>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take attendance | Rollcall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%2310231f'/%3E%3Cpath d='M8 7v20M14 7v20M20 7v20M26 7v20' stroke='%23f2c230' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/vendor/fonts/bricolage/index.css">
  <link rel="stylesheet" href="/vendor/fonts/figtree/index.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="attendance" data-roles="admin,faculty">
<div id="shell"></div>
<main id="page" class="page" hidden>
  <div class="page-head">
    <div><h1 class="page-title">Take attendance</h1><p class="page-sub">Everyone starts as present. Tap Absent for anyone who is missing, then save.</p></div>
  </div>
  <div class="panel panel-pad mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-5"><label class="form-label" for="classSel">Class</label><select class="form-select" id="classSel"></select></div>
      <div class="col-md-3"><label class="form-label" for="dateSel">Date</label><input class="form-control" type="date" id="dateSel"></div>
      <div class="col-md-4"><label class="form-label" for="findBox">Find a student</label><input class="form-control" id="findBox" placeholder="Name or roll number" autocomplete="off"></div>
    </div>
  </div>
  <div id="notice"></div>
  <div class="panel overflow-hidden" id="rollPanel"></div>
  <div class="savebar d-none" id="saveBar">
    <div><div class="count" id="cPresent">0</div><div class="lbl">present</div></div>
    <div><div class="count" id="cAbsent">0</div><div class="lbl">absent</div></div>
    <div class="split"><span class="p" id="barP"></span><span class="a" id="barA"></span></div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-ghost text-white border-secondary" id="allPresent" type="button"><i class="bi bi-check-all me-1"></i>Mark all present</button>
      <button class="btn btn-chalk" id="saveBtn" type="button"><i class="bi bi-save me-1"></i>Save attendance</button>
    </div>
  </div>
</main>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/attendance.js"></script>
</body>
</html>

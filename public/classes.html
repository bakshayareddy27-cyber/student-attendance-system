<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classes | Rollcall</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='8' fill='%2310231f'/%3E%3Cpath d='M8 7v20M14 7v20M20 7v20M26 7v20' stroke='%23f2c230' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/vendor/fonts/bricolage/index.css">
  <link rel="stylesheet" href="/vendor/fonts/figtree/index.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="classes" data-roles="admin">
<div id="shell"></div>
<main id="page" class="page" hidden>
  <div class="page-head">
    <div><h1 class="page-title">Classes</h1><p class="page-sub">The groups faculty take attendance for.</p></div>
    <button class="btn btn-chalk" id="addBtn"><i class="bi bi-plus-lg me-2"></i>Add class</button>
  </div>
  <div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Class</th><th>Department</th><th>Year</th><th>Section</th><th class="text-end">Students</th><th class="text-end">Actions</th></tr></thead><tbody id="body"></tbody></table></div></div>
</main>
<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form" novalidate>
  <div class="modal-header"><h2 class="modal-title h5" id="formTitle">Add class</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><div class="row g-3">
    <div class="col-12"><label class="form-label" for="f-name">Class name</label><input class="form-control" id="f-name" name="name" placeholder="III-CSM-B" required></div>
    <div class="col-12"><label class="form-label" for="f-department">Department</label><input class="form-control" id="f-department" name="department" placeholder="CSE (AI &amp; ML)" required></div>
    <div class="col-6"><label class="form-label" for="f-year">Year</label><select class="form-select" id="f-year" name="year"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div>
    <div class="col-6"><label class="form-label" for="f-section">Section</label><input class="form-control" id="f-section" name="section" placeholder="B"></div>
  </div></div>
  <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit" id="saveBtn">Save class</button></div>
</form></div></div>
<div class="modal fade" id="delModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h2 class="modal-title h5">Delete class?</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body" id="delText"></div>
  <div class="modal-footer"><button class="btn btn-ghost" data-bs-dismiss="modal">Keep class</button><button class="btn btn-danger" id="delBtn">Delete class</button></div></div></div></div>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/classes.js"></script>
</body>
</html>
